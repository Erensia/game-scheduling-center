# 로컬 개발용 설정. 06-tech-stack.md 결정: 개발/운영 모두 PostgreSQL (엔진 통일),
# 인스턴스만 분리 - 이 프로파일은 로컬 PostgreSQL을 가리킨다.
#
# 사전 준비 (README.md 참고):
#   1. backend/docker-compose.yml로 로컬 PostgreSQL 컨테이너 기동 (`docker compose up -d`)
#      - `game_scheduling_dev` 데이터베이스는 컨테이너 최초 기동 시 자동 생성됨 (수동 CREATE DATABASE 불필요)
#   2. 아래 username/password가 실제 로컬 환경과 다르면 이 파일만 수정 (커밋해도 되는 로컬 전용 값)
#
# 2026-08-04: 집 컴에서 쓰던 네이티브 PostgreSQL 서비스(postgresql-x64-18)를 중지·비활성화하고
# 회사 컴과 동일하게 Docker(docker-compose)로 통일함 (2026-07-25 트러블슈팅에서 다뤘던
# 네이티브/Docker 5432 포트 충돌 문제 자체가 더 이상 발생하지 않음 — 두 환경 모두 Docker 하나만 사용).

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/game_scheduling_dev
    username: postgres
    password: postgres
  jpa:
    hibernate:
      # 엔티티 변경사항을 스키마에 자동 반영 - 개발 단계 편의를 위한 설정이며 운영에는 쓰지 않는다.
      ddl-auto: update
    show-sql: true

logging:
  level:
    org.hibernate.SQL: debug
    
server:
  port: ${LOCAL_SERVER_PORT:8080}
