plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.erensia'
version = '0.0.1-SNAPSHOT'
description = 'Game Scheduling Center backend API (파밍 관제소)'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// 웹 / REST API
	implementation 'org.springframework.boot:spring-boot-starter-web'

	// 데이터 계층 - 02-domain-glossary.md, 03-erd.md 참고
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'org.postgresql:postgresql'

	// 요청 검증 (Bean Validation) - 04-api-spec.md 에러 코드 체계의 VALIDATION_ERROR 처리에 사용
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// API 문서 자동화 - 06-tech-stack.md 결정
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

	// 보일러플레이트 축소
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// 개발 편의 (자동 재시작 등)
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// 테스트
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// Spring Boot 4.x부터 @WebMvcTest 등 웹 관련 테스트 슬라이스 지원이
	// spring-boot-test-autoconfigure(공통 코어)에서 분리돼 별도 모듈로 옮겨간 것으로 보임
	// (2026-07-29 트러블슈팅 - jar-contents.txt 확인 결과 참고). 정확한 아티팩트명인지는
	// 실제 빌드로 확인 필요.
	testImplementation 'org.springframework.boot:spring-boot-webmvc-test'

	// 통합 테스트용 Testcontainers - 06-tech-stack.md 결정("H2 대신 운영과 동일 엔진 사용")과
	// 같은 이유로, 테스트도 실제 PostgreSQL 컨테이너를 띄워서 돌린다 (SQL 방언 불일치 방지).
	// org.testcontainers:* 모듈은 Spring Boot BOM만으로 버전이 안 잡혀서(2026-07-29 트러블슈팅 참고),
	// Testcontainers 자체 BOM을 platform으로 명시적으로 끌어와 버전을 고정한다.
	testImplementation platform('org.testcontainers:testcontainers-bom:1.20.4')
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
}

tasks.named('test') {
	useJUnitPlatform()
}

// 한글 테스트 메서드 이름(예: deleteGame_존재하는_게임이면_삭제한다)이 OS/IDE 기본 인코딩에 따라
// 깨지는 것을 방지 - javac가 항상 UTF-8로 소스를 읽고 클래스 파일을 쓰도록 고정한다.
tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}
